<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;background:#F2E9DC;color:#2F2B28;font-family:'EB Garamond',Georgia,serif;font-size:17px;line-height:1.55;padding:24px;position:relative;overflow:hidden}

  .caps{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:14px;letter-spacing:.32em;text-transform:uppercase}
  h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:34px;line-height:1.15;color:#8E1A1C}
  p{margin:0}
  .muted{color:#675C52;font-size:15px}
  a{color:#8E1A1C}
</style>
</head>
<body>
  <img class="leaf l" src="/assets/leaf_corner.png" alt="" aria-hidden="true">
  <img class="leaf r" src="/assets/leaf_corner.png" alt="" aria-hidden="true">

    <svg width="52" height="60" viewBox="0 0 64 74" role="img" aria-label="Monogram M &amp; J"><path d="M4 4 H60 V36 C60 54 46 65 32 71 C18 65 4 54 4 36 Z" fill="#FBF7F1" stroke="#C9A46A" stroke-width="2"/><path d="M9 9 H55 V36 C55 51 44 60 32 65 C20 60 9 51 9 36 Z" fill="none" stroke="#D98C8C" stroke-width="1.2"/><text x="32" y="39" text-anchor="middle" font-family="Cormorant Garamond, serif" font-weight="700" font-size="24" fill="#8E1A1C">M&amp;J</text></svg>

    <p class="muted">Link kwijt? Mail Marco via <a href="mailto:m.ballemaker@sirwinston.nl">m.ballemaker@sirwinston.nl</a>.</p>
  </main>
